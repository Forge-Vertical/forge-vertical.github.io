<style>
    #nav-wrapper {
        position: relative;

    }

    #nav-wrapper .nav-link {
        color: rgba(220, 228, 240, 0.85);
        transition: color 0.18s;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
    }
    #nav-wrapper .nav-link:hover { color: #84cc16; }

    #nav-wrapper .nav-cta {
        background: linear-gradient(90deg, #10b981, #84cc16);
        color: #06080c;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
        padding: 9px 20px;
        border-radius: 8px;
        transition: opacity 0.18s;
        white-space: nowrap;
    }
    #nav-wrapper .nav-cta:hover { opacity: 0.85; }

    /* Login button */
    #nav-wrapper .nav-login {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: rgba(220, 228, 240, 0.85);
        background: none;
        border: 1px solid rgba(132,204,22,0.3);
        border-radius: 8px;
        padding: 8px 18px;
        cursor: pointer;
        transition: all 0.18s;
        white-space: nowrap;
        text-decoration: none;
    }
    #nav-wrapper .nav-login:hover {
        border-color: #84cc16;
        color: #84cc16;
    }

    #nav-wrapper .bar {
        background: rgba(220,228,240,0.85);
        transition: all 0.3s;
    }

    .nav-pulse {
        display: inline-block;
        width: 5px; height: 5px;
        background: #84cc16;
        border-radius: 50%;
        animation: navPulse 1.5s ease-in-out infinite;
    }
    @keyframes navPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* Theme toggle (lives in the bar, so it can never overlap the page) */
    #nav-wrapper .nav-theme {
        width: 34px; height: 34px;
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        background: none;
        border: 1px solid rgba(220,228,240,0.22);
        border-radius: 8px;
        color: rgba(220,228,240,0.85);
        cursor: pointer;
        transition: all 0.18s;
        padding: 0;
    }
    #nav-wrapper .nav-theme:hover { border-color: #84cc16; color: #84cc16; }
    #nav-wrapper .nav-theme svg { width: 16px; height: 16px; }
    #nav-wrapper .nav-theme .ico-sun { display: none; }
    #nav-wrapper .nav-theme .ico-moon { display: block; }
    [data-theme="dark"] #nav-wrapper .nav-theme .ico-sun { display: block; }
    [data-theme="dark"] #nav-wrapper .nav-theme .ico-moon { display: none; }

    /* Hub badge */
    .nav-hub-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #84cc16;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
        transition: opacity 0.18s;
    }
    .nav-hub-badge:hover { opacity: 0.8; }
    .nav-hub-badge .hub-dot {
        width: 5px; height: 5px;
        background: #84cc16;
        border-radius: 50%;
        animation: navPulse 1.5s ease-in-out infinite;
    }
</style>

<style>
