<style>
    #nav-wrapper {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    /* ── AT REST — frosted glass, works on ANY background ── */
    /* Dark pages: text is light. Light pages: nav solidifies on scroll anyway. */
    #nav-wrapper .nav-inner {
        background: rgba(6, 8, 12, 0.55);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.07);
        transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* ── SCROLLED — fully solid dark, works on all pages ── */
    #nav-wrapper.scrolled .nav-inner {
        background: rgba(6, 8, 12, 0.96);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    /* ── LINKS — always white/light, lime on hover ── */
    #nav-wrapper .nav-link {
        color: rgba(220, 228, 240, 0.85);
        transition: color 0.18s;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
    }
    #nav-wrapper .nav-link:hover { color: #84cc16; }

    /* ── CTA BUTTON ── */
    #nav-wrapper .nav-cta {
        background: linear-gradient(90deg, #10b981, #84cc16);
        color: #06080c;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
        padding: 9px 20px;
        border-radius: 8px;
        transition: opacity 0.18s;
        white-space: nowrap;
    }
    #nav-wrapper .nav-cta:hover { opacity: 0.85; }

    /* ── HAMBURGER BARS ── */
    #nav-wrapper .bar {
        background: rgba(220,228,240,0.85);
        transition: all 0.3s;
    }

    /* ── BADGES ── */
    .nav-pulse {
        display: inline-block;
        width: 5px; height: 5px;
        background: #84cc16;
        border-radius: 50%;
        animation: navPulse 1.5s ease-in-out infinite;
    }
    @keyframes navPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.7); }
    }
    .nav-new {
        display: inline-block;
        font-size: 7px; font-weight: 900;
        letter-spacing: 0.1em; text-transform: uppercase;
        background: #84cc16; color: #000;
        padding: 1px 5px; border-radius: 3px;
        margin-left: 4px; vertical-align: middle; line-height: 1.6;
    }
</style>

<div id="nav-wrapper">
    <div class="nav-inner">
        <nav class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center relative">

            <!-- Logo -->
            <a href="/index.html" class="flex items-center z-50">
                <svg width="240" height="34" viewBox="0 0 240 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" letter-spacing="-0.02em" fill="#f0f2f4">FORGE</text>
                    <text x="90" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" letter-spacing="-0.02em" fill="#84cc16">VERTICAL</text>
                </svg>
            </a>

            <!-- Desktop nav -->
            <div class="hidden md:flex gap-7 items-center">
                <a href="/about.html" class="nav-link">About</a>
                <a href="/index.html#services" class="nav-link">Services</a>
                <a href="/portfolio.html" class="nav-link">Portfolio</a>
                <a href="/articles.html" class="nav-link">Articles<span class="nav-new">New</span></a>
                <a href="/security-intelligence.html" class="nav-link">Security</a>
                <a href="/tools/revenue-audit.html" class="nav-link flex items-center gap-2">
                    Audit Tool<span class="nav-pulse"></span>
                </a>
                <a href="/onboard.html" class="nav-cta ml-2">
                    Start a project
                </a>
            </div>

            <!-- Hamburger -->
            <button onclick="toggleMobileMenu()" id="menu-toggle"
                class="md:hidden z-50 p-2 flex flex-col gap-1.5 items-end focus:outline-none">
                <span id="bar-1" class="bar w-7 h-0.5 rounded-full"></span>
                <span id="bar-2" class="bar w-5 h-0.5 rounded-full" style="background:#84cc16 !important;"></span>
                <span id="bar-3" class="bar w-7 h-0.5 rounded-full"></span>
            </button>

            <!-- Mobile menu -->
            <div id="mobile-menu"
                class="fixed inset-0 bg-[#06080c] z-40 translate-x-full transition-transform duration-500 ease-in-out md:hidden flex flex-col items-center justify-center gap-7 text-center">
                <a href="/about.html" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-zinc-200 hover:text-[#84cc16] transition-colors" style="font-family:'JetBrains Mono',monospace;">About</a>
                <a href="/index.html#services" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-zinc-200 hover:text-[#84cc16] transition-colors" style="font-family:'JetBrains Mono',monospace;">Services</a>
                <a href="/portfolio.html" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-zinc-200 hover:text-[#84cc16] transition-colors" style="font-family:'JetBrains Mono',monospace;">Portfolio</a>
                <a href="/articles.html" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-zinc-200 hover:text-[#84cc16] transition-colors" style="font-family:'JetBrains Mono',monospace;">Articles</a>
                <a href="/security-intelligence.html" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-zinc-200 hover:text-[#84cc16] transition-colors" style="font-family:'JetBrains Mono',monospace;">Security</a>
                <a href="/tools/revenue-audit.html" onclick="toggleMobileMenu()" class="text-xl font-bold uppercase tracking-widest text-[#84cc16]" style="font-family:'JetBrains Mono',monospace;">Audit Tool</a>
                <a href="/onboard.html" onclick="toggleMobileMenu()"
                    class="mt-4 px-8 py-4 rounded-xl font-bold uppercase tracking-widest text-sm"
                    style="background:linear-gradient(90deg,#10b981,#84cc16);color:#06080c;font-family:'JetBrains Mono',monospace;">
                    Start a project
                </a>
            </div>

        </nav>
    </div>
</div>

<script>
    (function() {
        const wrapper = document.getElementById('nav-wrapper');
        function onScroll() {
            wrapper.classList.toggle('scrolled', window.scrollY > 40);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    })();

    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const bar1 = document.getElementById('bar-1');
        const bar2 = document.getElementById('bar-2');
        const bar3 = document.getElementById('bar-3');
        menu.classList.toggle('translate-x-full');
        const open = !menu.classList.contains('translate-x-full');
        bar1.style.transform = open ? 'translateY(8px) rotate(45deg)' : 'none';
        bar2.style.opacity   = open ? '0' : '1';
        bar3.style.transform = open ? 'translateY(-8px) rotate(-45deg)' : 'none';
    }
</script>
