<script>
    // Nav is not sticky — no scroll listener needed

    // ── Scroll to top button ─────────────────────────────
    (function() {
        const btn = document.getElementById('scroll-top-btn');
        if (!btn) return;
        window.addEventListener('scroll', () => {
            btn.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
        btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    })();

    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const bar1 = document.getElementById('bar-1');
        const bar2 = document.getElementById('bar-2');
        const bar3 = document.getElementById('bar-3');
        menu.classList.toggle('translate-x-full');
        const open = !menu.classList.contains('translate-x-full');
        bar1.style.transform = open ? 'translateY(8px) rotate(45deg)' : 'none';
        bar2.style.opacity   = open ? '0' : '1';
        bar3.style.transform = open ? 'translateY(-8px) rotate(-45deg)' : 'none';
    }
</script>

<!-- Scroll to top button -->
<style>
    #scroll-top-btn {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #10b981, #84cc16);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(132,204,22,0.25);
    }
    #scroll-top-btn.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }
    #scroll-top-btn:hover {
        box-shadow: 0 6px 28px rgba(132,204,22,0.4);
    }
    #scroll-top-btn svg {
        width: 18px;
        height: 18px;
    }
</style>

<button id="scroll-top-btn" aria-label="Scroll to top">

</button>
