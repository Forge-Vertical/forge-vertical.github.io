# ─────────────────────────────────────────────────────────────────
# SYNC_DIRECTORY.yml
# Runs daily at 2am UTC + on push when fv-extras.json changes
# Fetches SiteBuild Studio listings from GitHub raw, merges with
# fv-extras.json, commits combined file as directory/listings.json
# ─────────────────────────────────────────────────────────────────
name: Sync Business Directory

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'directory/fv-extras.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORGE_VERTICAL_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Fetch SiteBuild Studio listings
        run: |
          curl -s \
            -H "User-Agent: Mozilla/5.0" \
            "https://raw.githubusercontent.com/SiteBuild-Studio/SiteBuild-Studio/main/directory/listings.json" \
            -o /tmp/sb-listings.json
          echo "Fetched. Top-level keys:"
          python3 -c "import json; d=json.load(open('/tmp/sb-listings.json')); print(list(d.keys()))"

      - name: Merge and write combined listings
        run: |
          python3 << 'PYEOF'
          import json, re

          SB_IMG    = "https://www.sitebuildstudio.co.za/directory/images/"
          SB_ASSETS = "https://www.sitebuildstudio.co.za/assets/images/"

          def fix_logo(raw):
              if not raw: return ""
              if raw.startswith("http"): return raw
              if "assets/images/" in raw: return SB_ASSETS + raw.split("assets/images/")[-1]
              if "images/" in raw: return SB_IMG + raw.split("images/")[-1]
              return SB_IMG + raw

          def fix_location(loc):
              return re.sub(r',?\s*South Africa', '', loc or '').strip()

          # Map SiteBuild Studio long category strings to short IDs
          CAT_MAP = {
              "travel & accommodation": "hospitality",
              "hospitality": "hospitality",
              "autobody shop": "automotive",
              "auto mechanic": "automotive",
              "automotive locksmith": "automotive",
              "rope access & high-rise maintenance": "trades",
              "home maintenance & renovations": "trades",
              "cleaning services": "trades",
              "electrician & handyman": "trades",
              "plumber": "trades",
              "nonprofit & skills development": "nonprofit",
              "nonprofit & youth development": "nonprofit",
              "bookkeeping & accounting": "professional",
              "hair & beauty salon": "professional",
              "ai vehicle damage assessment": "tech",
              "cybersecurity & security research": "tech",
              "web hosting & vps": "tech",
              "technology": "tech",
          }

          def map_category(cat):
              return CAT_MAP.get((cat or "").lower(), cat.lower().split(" & ")[0][:12])

          def normalise(l, source):
              cat = l.get("category", "")
              return {
                  **l,
                  "_source": source,
                  "logo": fix_logo(l.get("logo", "")),
                  "location": fix_location(l.get("location", "")),
                  "category": map_category(cat),
                  "tagline": l.get("tagline", (l.get("description", "")[:80] + "...") if len(l.get("description","")) > 80 else l.get("description","")),
                  "verified": l.get("verified", True),
                  "featured": l.get("featured", False),
                  "tags": l.get("tags", [cat] if cat else []),
                  "logo_initial": l.get("logo_initial", (l.get("name","??")[:2].upper())),
              }

          # Load SiteBuild Studio — key is "businesses"
          with open('/tmp/sb-listings.json') as f:
              sb_raw = json.load(f)
          sb_listings = [normalise(l, "sitebuild") for l in sb_raw.get("businesses", [])]

          # Load FV extras — key is "listings"
          with open('directory/fv-extras.json') as f:
              fv_raw = json.load(f)
          fv_listings = [normalise(l, l.get("_source","forge-vertical")) for l in fv_raw.get("listings", [])]

          # Merge — FV wins on duplicate IDs
          fv_ids = {l["id"] for l in fv_listings}
          merged = fv_listings + [l for l in sb_listings if l["id"] not in fv_ids]

          output = {
              "meta": {
                  "total_listings": len(merged),
                  "sources": ["forge-vertical", "sitebuild-studio"]
              },
              "listings": merged
          }

          with open('directory/listings.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f"Done: {len(fv_listings)} FV + {len([l for l in sb_listings if l['id'] not in fv_ids])} SB = {len(merged)} total")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add directory/listings.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "sync: directory listings [$(date -u +%Y-%m-%d)]"
            git push
          fi
